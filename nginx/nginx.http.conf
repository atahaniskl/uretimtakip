# =====================================================
# nginx.http.conf — HTTP ONLY
# Kullanım: İlk kurulum ve SSL sertifika alımı sırasında
# Let's Encrypt ACME doğrulama challenge'ına izin verir.
# setup-ssl.sh bu dosyayla başlar.
# =====================================================

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream minio_storage {
    server minio:9000;
}

server {
    listen 80;
    server_name _;

    # --- Güvenlik header'ları ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --- Upload limiti ---
    client_max_body_size 50M;

    # ---- Let's Encrypt ACME challenge (certbot webroot) ----
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---- SSE ----
    location /api/v1/events {
        proxy_pass http://backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/events {
        proxy_pass http://backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- API ----
    location /api {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # ---- MinIO ----
    location /storage {
        rewrite ^/storage/(.*) /$1 break;
        proxy_pass http://minio_storage;
        proxy_set_header Host $host;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ---- Frontend static ----
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
