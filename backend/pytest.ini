[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# Varsayilan cikti sade: sadece ozet + hatalar. Tek tek test adlarini gormek
# icin:  pytest -v      Tek bir dosya/test icin:  pytest tests/test_date_utils.py -v
addopts = -q --tb=short --no-header
