# ============================================
# Dynamic Production Scheduler (DPS)
# Docker Compose — PRODUCTION
# ============================================
# İlk kurulum:  bash deploy.sh
# SSL kurulum:  bash setup-ssl.sh
# Güncelleme:   bash deploy.sh
# ============================================

services:

  # ===========================================
  # PostgreSQL
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: dps_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dps_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ===========================================
  # Redis
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: dps_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - dps_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ===========================================
  # MinIO
  # ===========================================
  minio:
    image: minio/minio:latest
    container_name: dps_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    networks:
      - dps_internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================
  # Backend (FastAPI — gunicorn/uvicorn)
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: dps_backend:latest
    container_name: dps_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    expose:
      - "8000"
    # Volume mount YOK — image'a bake edilmiş kod çalışır
    networks:
      - dps_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ===========================================
  # Celery Worker
  # ===========================================
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: dps_backend:latest
    container_name: dps_celery_worker
    restart: unless-stopped
    command: >
      celery -A app.celery_app:celery_app worker
      --loglevel=info
      --concurrency=2
      --max-tasks-per-child=200
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    networks:
      - dps_internal
    depends_on:
      backend:
        condition: service_healthy

  # ===========================================
  # Nginx (frontend statik + reverse proxy)
  # Config host'tan mount edilir — SSL için rebuild gerekmez
  # ===========================================
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: dps_nginx:latest
    container_name: dps_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      # Aktif nginx config — deploy.sh/setup-ssl.sh tarafından yönetilir
      - ./nginx/nginx.active.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt sertifikaları (setup-ssl.sh tarafından doldurulur)
      - certbot_certs:/etc/letsencrypt:ro
      # ACME challenge webroot (certbot renewal için)
      - certbot_webroot:/var/www/certbot:ro
    networks:
      - dps_internal
    depends_on:
      backend:
        condition: service_healthy

  # ===========================================
  # Certbot — otomatik sertifika yenileme
  # (setup-ssl.sh çalıştırıldıktan sonra aktif)
  # ===========================================
  certbot:
    image: certbot/certbot:latest
    container_name: dps_certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # Her 12 saatte bir sertifika yenileme kontrolü
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres_data:
    name: dps_postgres_data
  redis_data:
    name: dps_redis_data
  minio_data:
    name: dps_minio_data
  certbot_certs:
    name: dps_certbot_certs
  certbot_webroot:
    name: dps_certbot_webroot

# ===========================================
# Networks
# ===========================================
networks:
  dps_internal:
    name: dps_internal
    driver: bridge
