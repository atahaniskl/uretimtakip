# ============================================
# Dynamic Production Scheduler (DPS) v1.9
# Docker Compose - Phase 1 & 2
# ============================================

services:
  # =============================================
  # PostgreSQL Database
  # =============================================
  postgres:
    image: postgres:16-alpine
    container_name: dps_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dps_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =============================================
  # Redis (Task Queue Broker + Pub/Sub for SSE)
  # =============================================
  redis:
    image: redis:7-alpine
    container_name: dps_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - dps_backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # =============================================
  # MinIO Object Storage (Excel file uploads)
  # =============================================
  minio:
    image: minio/minio:latest
    container_name: dps_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - dps_backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =============================================
  # Authentik PostgreSQL Database
  # =============================================
  authentik_postgres:
    image: postgres:16-alpine
    container_name: dps_authentik_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTHENTIK_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTHENTIK_POSTGRES_DB}
    volumes:
      - authentik_postgres_data:/var/lib/postgresql/data
    networks:
      - dps_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTHENTIK_POSTGRES_USER} -d ${AUTHENTIK_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =============================================
  # Authentik Redis
  # =============================================
  authentik_redis:
    image: redis:alpine
    container_name: dps_authentik_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - authentik_redis_data:/data
    networks:
      - dps_backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # =============================================
  # Authentik Server
  # =============================================
  authentik_server:
    image: ghcr.io/goauthentik/server:latest
    container_name: dps_authentik_server
    restart: unless-stopped
    command: server
    env_file:
      - .env
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: authentik_redis
      AUTHENTIK_POSTGRESQL__HOST: authentik_postgres
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRES_DB}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
    ports:
      - "9005:9000"
      - "9448:9443"
    networks:
      - dps_backend
    depends_on:
      authentik_postgres:
        condition: service_healthy
      authentik_redis:
        condition: service_healthy

  # =============================================
  # Authentik Worker
  # =============================================
  authentik_worker:
    image: ghcr.io/goauthentik/server:latest
    container_name: dps_authentik_worker
    restart: unless-stopped
    command: worker
    env_file:
      - .env
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: authentik_redis
      AUTHENTIK_POSTGRESQL__HOST: authentik_postgres
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRES_DB}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
    networks:
      - dps_backend
    depends_on:
      authentik_postgres:
        condition: service_healthy
      authentik_redis:
        condition: service_healthy

  # =============================================
  # Backend (FastAPI)
  # =============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dps_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/2
      MINIO_ENDPOINT: minio:${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    networks:
      - dps_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # =============================================
  # Celery Worker (Background Tasks)
  # =============================================
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dps_celery_worker
    restart: unless-stopped
    command: celery -A app.celery_app:celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/2
      MINIO_ENDPOINT: minio:${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./backend:/app
    networks:
      - dps_backend
    depends_on:
      backend:
        condition: service_healthy

  # =============================================
  # Flower (Celery Monitoring UI)
  # =============================================
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dps_flower
    restart: unless-stopped
    command: celery -A app.celery_app:celery_app flower --port=5555
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/2
    ports:
      - "5555:5555"
    networks:
      - dps_backend
    depends_on:
      celery_worker:
        condition: service_started

  # =============================================
  # Frontend (React + Vite)
  # =============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dps_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - dps_frontend

  # =============================================
  # Nginx Reverse Proxy
  # =============================================
  nginx:
    image: nginx:1.25-alpine
    container_name: dps_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dps_frontend
      - dps_backend
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

# =============================================
# Networks (Isolated)
# =============================================
networks:
  dps_frontend:
    name: dps_frontend
    driver: bridge
  dps_backend:
    name: dps_backend
    driver: bridge

# =============================================
# Persistent Volumes
# =============================================
volumes:
  postgres_data:
    name: dps_postgres_data
  redis_data:
    name: dps_redis_data
  minio_data:
    name: dps_minio_data
  authentik_postgres_data:
    name: dps_authentik_postgres_data
  authentik_redis_data:
    name: dps_authentik_redis_data
